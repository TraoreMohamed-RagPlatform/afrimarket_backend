name: CI/CD Pipeline - Security & Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Moindre privilège : lecture seule par défaut, élargi job par job si besoin.
permissions:
  contents: read

# Une nouvelle poussée sur la même branche annule l'exécution précédente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  # ========================================
  # CONTRÔLES BLOQUANTS : un échec bloque la fusion
  # ========================================

  lint:
    name: 🧹 ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  tests:
    name: 🧪 Tests + couverture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  prisma:
    name: 🗄️ Schéma Prisma
    runs-on: ubuntu-24.04
    env:
      # Valeur factice : la validation ne se connecte pas à la base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate

  audit:
    name: 📦 npm audit (production)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Bloque sur les vulnérabilités élevées ou critiques des dépendances livrées.
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    name: 🛡️ CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  # ========================================
  # ANALYSES COMPLÉMENTAIRES : informatives, ne bloquent pas
  # (elles dépendent de services externes et de jetons optionnels)
  # ========================================

  sonarcloud:
    name: 📊 SonarCloud (informatif)
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Analyse SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snyk:
    name: 🔍 Snyk (informatif)
    runs-on: ubuntu-24.04
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Analyse Snyk
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        with:
          args: --severity-threshold=high

  dependency-check:
    name: 🧾 OWASP Dependency-Check (informatif)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: afrimarket_backend
          path: '.'
          format: SARIF
          args: --exclude node_modules
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

  # ========================================
  # RÉSUMÉ : échoue si un contrôle bloquant a échoué
  # ========================================

  summary:
    name: 📋 Résumé
    runs-on: ubuntu-24.04
    if: always()
    needs: [lint, tests, prisma, audit, codeql, sonarcloud, snyk, dependency-check]
    steps:
      - name: Générer le résumé
        run: |
          {
            echo "## 📋 Pipeline - AfriMarket Backend"
            echo ""
            echo "| Contrôle | Résultat | Bloquant |"
            echo "|---|---|---|"
            echo "| 🧹 ESLint | ${{ needs.lint.result }} | oui |"
            echo "| 🧪 Tests | ${{ needs.tests.result }} | oui |"
            echo "| 🗄️ Prisma | ${{ needs.prisma.result }} | oui |"
            echo "| 📦 npm audit | ${{ needs.audit.result }} | oui |"
            echo "| 🛡️ CodeQL | ${{ needs.codeql.result }} | oui |"
            echo "| 📊 SonarCloud | ${{ needs.sonarcloud.result }} | non |"
            echo "| 🔍 Snyk | ${{ needs.snyk.result }} | non |"
            echo "| 🧾 Dependency-Check | ${{ needs.dependency-check.result }} | non |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Échouer si un contrôle bloquant a échoué
        if: >-
          needs.lint.result != 'success' || needs.tests.result != 'success' ||
          needs.prisma.result != 'success' || needs.audit.result != 'success' ||
          needs.codeql.result != 'success'
        run: |
          echo "❌ Un contrôle bloquant a échoué"
          exit 1
